workflows:
  urho3d-android:
    name: Urho3D Android - Build Test
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17
      ndk: 21.4.7075529

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build Urho3D Android
        script: |
          chmod +x ./gradlew
          ./gradlew :android:launcher-app:assembleDebug --stacktrace

    artifacts:
      - android/launcher-app/build/outputs/**/*.apk
      - android/urho3d-lib/build/outputs/**/*.aar